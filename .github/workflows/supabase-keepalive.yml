# Plano grátis do Supabase pausa o banco após 7 dias sem uso.
# Uma consulta por dia mantém ativo. Se falhar, o GitHub manda e-mail avisando.
name: Supabase keepalive

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consulta a tabela produtos
        run: |
          URL=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' assets/js/supabase-config.js)
          KEY=$(grep -oE 'sb_publishable_[A-Za-z0-9_]+' assets/js/supabase-config.js)
          curl -sS --fail -H "apikey: $KEY" "$URL/rest/v1/produtos?select=id&limit=1"
